<!doctype html>
<!--
  Template for the app icons (apple-touch-icon.png, icon-192.png, icon-512.png,
  favicon.ico). Rendered at 512x512, then downscaled.
  Regenerate with: python scripts/build_assets.py
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon</title>
<style>
  @font-face { font-family: 'Newsreader'; src: url('../public/fonts/newsreader-latin.woff2') format('woff2'); font-weight: 200 800; }
  * { margin: 0; padding: 0; }
  html, body { width: 512px; height: 512px; overflow: hidden; }
  body {
    background: #A4452C; color: #F7F4EE;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Newsreader', Georgia, serif; font-size: 248px; font-weight: 400;
    letter-spacing: -0.02em; line-height: 1;
  }
  span { transform: translateY(-4%); }
</style>
</head>
<body><span>KS</span></body>
</html>
