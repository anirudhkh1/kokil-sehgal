<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Kokil Sehgal</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F7F4EE">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/newsreader-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 28px; padding: 48px var(--gutter); }
    .not-found h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 5.6vw, 64px); line-height: 1.05; letter-spacing: -0.02em; }
    .not-found p { font-size: 18px; line-height: 1.55; color: var(--body); max-width: 440px; margin: 0 auto; }
  </style>
</head>
<body>
  <main class="not-found">
    <p class="eyebrow">404</p>
    <h1>This page doesn't exist.</h1>
    <p>The link may be old or mistyped. Everything I do is on the home page.</p>
    <div><a class="btn btn--accent" href="/">Back to the home page</a></div>
  </main>
</body>
</html>
